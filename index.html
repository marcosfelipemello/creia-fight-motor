  /* sem zoom: toque duplo e pinça não ampliam a tela (botões do celular apertados rápido davam zoom) */

  canvas {

<script>
  // iPhone ignora user-scalable=no: bloqueia pinça e toque duplo na mão
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  var lastTap = 0;
  document.addEventListener('touchend', function (e) { if (e.target.closest && e.target.closest('#creia-ui')) return; var n = Date.now(); if (n - lastTap < 350) e.preventDefault(); lastTap = n; }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
</script>
